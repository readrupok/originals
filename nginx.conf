server {
    listen 80;
    server_name _;
    server_tokens off;
    # Behind a TLS proxy on the same machine (Caddy, or nginx with Let's Encrypt),
    # every request arrives from a private address. Take the visitor's IP from that
    # proxy's X-Forwarded-For instead, so rate limits count each reader on their own.
    # Only private-network peers are trusted: a visitor connecting directly cannot
    # forge an address this way.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Send path-only Location headers. nginx would otherwise rebuild an absolute
    # URL from its own listen port (80 inside the container), dropping the port
    # the site is actually published on.
    absolute_redirect off;

    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    # Not in nginx's default table; with nosniff, the app manifest needs its real type.
    types { application/manifest+json webmanifest; }
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    # Fingerprinted build files and images: cache for a year
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp|avif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API → Fastify. X-Forwarded-For is overwritten (not appended) so clients cannot spoof their IP.
    location ^~ /api/ {
        # Author image uploads are capped at 5 MB by the API; allow headroom for
        # multipart framing so the API answers with its own JSON error instead of
        # nginx's HTML 413 page, which the client cannot parse.
        client_max_body_size 6m;
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap and robots are generated from the database. Host goes along: the main
    # site, stories. and originals. each have their own.
    location = /sitemap.xml { proxy_pass http://server:5000/sitemap.xml; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /feed.xml    { proxy_pass http://server:5000/feed.xml;    proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /robots.txt  { proxy_pass http://server:5000/robots.txt;  proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
    # A platform under a path of this host (/stories, /originals) has its own sitemap there
    location ~ ^/[a-z0-9-]+/sitemap\.xml$ { proxy_pass http://server:5000$uri; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }

    # The bare app shell — fetched by the server to render page heads; also the fallback page
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Bangla lives at the clean path, so /bn → / and /bn/series → /series (301).
    # English pages live under /en and are rendered like any other page.
    location ~ ^/bn(/.*)?$ {
        set $clean_path $1;
        if ($clean_path = "") { set $clean_path /; }
        return 301 $clean_path$is_args$args;
    }

    # Every page URL is rendered by the server with its own title, description, canonical,
    # hreflang, Open Graph and structured data. If the server is down, the plain shell is served.
    location / {
        try_files $uri @page;
    }

    location @page {
        proxy_pass http://server:5000/seo$uri$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API's own security headers are replaced by the site's
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Origin-Agent-Cluster;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header X-Download-Options;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_hide_header X-XSS-Protection;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /index.html;
    }
}
